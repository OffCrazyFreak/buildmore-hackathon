<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildMore Hackathon, landing versions</title>
    <style>
      :root {
        color-scheme: dark;
        --bar: #111214;
        --line: #2a2c31;
        --text: #e8e8ea;
        --muted: #9a9ca3;
        --accent: #ffd166;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        color: var(--text);
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
      }

      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        background: var(--bar);
        border-top: 1px solid var(--line);
        font-size: 13px;
      }

      .bar .group {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }

      .bar .label {
        color: var(--muted);
        margin-right: 4px;
      }

      .bar button,
      .bar a {
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 9px;
        cursor: pointer;
        text-decoration: none;
      }

      .bar button[aria-current="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }

      .bar button:hover,
      .bar a:hover {
        border-color: var(--muted);
      }

      .bar button:focus-visible,
      .bar a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .spacer {
        flex: 1;
      }

      .hint {
        color: var(--muted);
      }

      @media (max-width: 600px) {
        .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Landing page version"></iframe>

    <nav class="bar" aria-label="Version switcher">
      <div class="group" id="design-group">
        <span class="label">design skill</span>
      </div>
      <div class="group" id="free-group">
        <span class="label">no skill</span>
      </div>
      <div class="group" id="combo-group">
        <span class="label">combo</span>
      </div>
      <span class="spacer"></span>
      <span class="hint" aria-hidden="true">arrow keys switch, r reloads</span>
      <a id="open" href="versions/design-01/" target="_blank" rel="noopener"> open alone </a>
    </nav>

    <script>
      const versions = ["design-01", "free-01", "free-02", "combo-01", "combo-02", "combo-03"];

      const frame = document.getElementById("frame");
      const openLink = document.getElementById("open");
      const groups = {
        design: document.getElementById("design-group"),
        free: document.getElementById("free-group"),
        combo: document.getElementById("combo-group"),
      };
      const buttons = new Map();

      for (const name of versions) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = name.split("-")[1];
        button.setAttribute("aria-label", name);
        button.addEventListener("click", () => select(name));
        groups[name.split("-")[0]].append(button);
        buttons.set(name, button);
      }

      function current() {
        const name = location.hash.slice(1);
        return versions.includes(name) ? name : versions[0];
      }

      function select(name) {
        if (location.hash.slice(1) !== name) {
          location.hash = name;
          return;
        }
        render();
      }

      function render() {
        const name = current();
        const src = `versions/${name}/`;

        if (frame.getAttribute("src") !== src) frame.src = src;
        openLink.href = src;
        document.title = `${name}, BuildMore Hackathon landing`;

        for (const [key, button] of buttons) {
          button.setAttribute("aria-current", String(key === name));
        }
      }

      function step(delta) {
        const index = versions.indexOf(current());
        const next = (index + delta + versions.length) % versions.length;
        select(versions[next]);
      }

      window.addEventListener("hashchange", render);
      function handleKey(key) {
        if (key === "ArrowRight") step(1);
        if (key === "ArrowLeft") step(-1);
        if (key === "r") frame.src = frame.src;
      }

      window.addEventListener("keydown", (event) => handleKey(event.key));

      // The iframe swallows key events once it has focus, so forward its own keys up.
      frame.addEventListener("load", () => {
        frame.contentWindow.addEventListener("keydown", (event) => handleKey(event.key));
      });

      render();
    </script>
  </body>
</html>

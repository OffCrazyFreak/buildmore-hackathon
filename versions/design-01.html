<!doctype html>
<!-- Concept: ember particle field that parts around the pointer -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildMore Hackathon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0908;
        --ink: #f6ead8;
        --ember: #ff7a1a;
        --ember-dim: #b4471a;
        --muted: #a89684;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "IBM Plex Mono", monospace;
        overflow: hidden;
        touch-action: none;
      }

      .hero {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .field {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse 60% 55% at 50% 50%,
          rgba(11, 9, 8, 0.55) 0%,
          rgba(11, 9, 8, 0) 70%
        );
      }

      .copy {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 0 1.5rem;
        pointer-events: none;
        mix-blend-mode: normal;
      }

      .copy > * {
        opacity: 0;
        transform: translateY(14px);
        animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }

      .title {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: clamp(2.6rem, 9vw, 8.5rem);
        line-height: 0.95;
        letter-spacing: -0.03em;
        text-wrap: balance;
        animation-delay: 120ms;
      }

      .loop {
        margin-top: 1.4rem;
        font-size: clamp(0.85rem, 2.2vw, 1.45rem);
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ember);
        animation-delay: 420ms;
      }

      .soon {
        margin-top: 2.2rem;
        font-size: clamp(0.75rem, 1.4vw, 0.95rem);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--muted);
        animation-delay: 720ms;
      }

      .soon::before,
      .soon::after {
        content: "";
        display: inline-block;
        width: 2.5rem;
        height: 1px;
        background: var(--ember-dim);
        vertical-align: middle;
        margin: 0 1rem;
      }

      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      :focus-visible {
        outline: 2px solid var(--ember);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .copy > * {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero" id="hero">
      <canvas class="field" id="field" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="copy">
        <h1 class="title">BuildMore Hackathon</h1>
        <p class="loop">Prompt - Review - Ship - Repeat</p>
        <p class="soon">coming soon</p>
      </div>
    </main>

    <script>
      (function () {
        const canvas = document.getElementById("field");
        const ctx = canvas.getContext("2d");
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const MAX_PARTICLES = 1400;
        const pointer = { x: -9999, y: -9999, active: false };
        let width = 0;
        let height = 0;
        let dpr = 1;
        let particles = [];
        let rafId = 0;
        let time = 0;

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          seed();
        }

        function seed() {
          const count = Math.min(MAX_PARTICLES, Math.floor((width * height) / 1500));
          particles = [];
          for (let i = 0; i < count; i += 1) {
            particles.push(makeParticle(true));
          }
        }

        function makeParticle(anywhere) {
          return {
            x: Math.random() * width,
            y: anywhere ? Math.random() * height : height + 4,
            vx: 0,
            vy: 0,
            size: 0.6 + Math.random() * 1.6,
            heat: Math.random(),
            life: Math.random(),
          };
        }

        // Sum of sines is cheap and smooth enough to pass for a flow field at this density.
        function flowAngle(x, y, t) {
          return (
            Math.sin(x * 0.0032 + t * 0.4) * 1.3 +
            Math.cos(y * 0.0041 - t * 0.3) * 1.1 +
            Math.sin((x + y) * 0.0018 + t * 0.15)
          );
        }

        function step(dt) {
          time += dt;
          for (let i = 0; i < particles.length; i += 1) {
            const p = particles[i];
            const a = flowAngle(p.x, p.y, time);
            p.vx += Math.cos(a) * 0.06;
            p.vy += Math.sin(a) * 0.06 - 0.035;

            if (pointer.active) {
              const dx = p.x - pointer.x;
              const dy = p.y - pointer.y;
              const d2 = dx * dx + dy * dy;
              const radius = 170;
              if (d2 < radius * radius && d2 > 0.01) {
                const d = Math.sqrt(d2);
                const push = (1 - d / radius) * 2.4;
                p.vx += (dx / d) * push;
                p.vy += (dy / d) * push;
                p.heat = Math.min(1, p.heat + 0.08);
              }
            }

            p.vx *= 0.94;
            p.vy *= 0.94;
            p.x += p.vx;
            p.y += p.vy;
            p.heat *= 0.985;
            p.life += 0.004;

            if (p.y < -6 || p.x < -6 || p.x > width + 6 || p.life > 1) {
              particles[i] = makeParticle(false);
            }
          }
        }

        function draw() {
          ctx.fillStyle = "rgba(11, 9, 8, 0.28)";
          ctx.fillRect(0, 0, width, height);
          for (let i = 0; i < particles.length; i += 1) {
            const p = particles[i];
            const fade = Math.sin(p.life * Math.PI);
            const warm = 0.35 + p.heat * 0.65;
            const r = 255;
            const g = Math.floor(90 + warm * 90);
            const b = Math.floor(20 + (1 - warm) * 60);
            ctx.fillStyle =
              "rgba(" +
              r +
              "," +
              g +
              "," +
              b +
              "," +
              (fade * (0.25 + p.heat * 0.7)).toFixed(3) +
              ")";
            const s = p.size * (0.8 + p.heat);
            ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
          }
        }

        let last = 0;
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000) || 0.016;
          last = now;
          step(dt);
          draw();
          rafId = requestAnimationFrame(frame);
        }

        function start() {
          if (rafId || reduced) return;
          last = performance.now();
          rafId = requestAnimationFrame(frame);
        }

        function stop() {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }

        function onPointer(event) {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
        }

        function onLeave() {
          pointer.active = false;
        }

        window.addEventListener("pointermove", onPointer, { passive: true });
        window.addEventListener("pointerdown", onPointer, { passive: true });
        window.addEventListener("pointerup", onLeave);
        window.addEventListener("pointercancel", onLeave);
        document.addEventListener("pointerleave", onLeave);
        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else start();
        });

        resize();
        if (reduced) {
          ctx.fillStyle = "#0b0908";
          ctx.fillRect(0, 0, width, height);
          for (let i = 0; i < 40; i += 1) step(0.016);
          draw();
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>

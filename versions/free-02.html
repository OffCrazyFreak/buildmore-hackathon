<!doctype html>
<!-- Concept: magnetic spring letters that scatter and regroup around the pointer -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildMore Hackathon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07231a;
        --lime: #d8ff4a;
        --mint: #7fe0b0;
        --gx: 50%;
        --gy: 50%;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--lime);
        font-family: "Space Grotesk", system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .glow {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle 42vmax at var(--gx) var(--gy),
          rgba(127, 224, 176, 0.22),
          transparent 70%
        );
        pointer-events: none;
      }

      .hero {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 6vmin;
      }

      .line {
        display: block;
      }

      .line-1 {
        font-family: "Archivo Black", "Space Grotesk", sans-serif;
        font-size: clamp(2.4rem, 9.5vw, 9rem);
        line-height: 1;
        letter-spacing: -0.01em;
      }

      .line-2 {
        margin-top: 0.9em;
        font-size: clamp(1rem, 3vw, 2.4rem);
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mint);
      }

      .line-3 {
        margin-top: 1.2em;
        font-size: clamp(1.1rem, 2.6vw, 2rem);
        font-weight: 400;
        letter-spacing: 0.3em;
      }

      .word {
        display: inline-block;
        white-space: nowrap;
      }

      .letter {
        display: inline-block;
        will-change: transform;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      :focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="hero">
      <div>
        <h1 class="line line-1" data-split>BuildMore Hackathon</h1>
        <p class="line line-2" data-split>Prompt - Review - Ship - Repeat</p>
        <p class="line line-3" data-split>coming soon</p>
      </div>
    </main>
    <script>
      (function () {
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const root = document.documentElement;
        const letters = [];
        const pointer = { x: -9999, y: -9999, down: false, inside: false };
        let frame = 0;
        let time = 0;
        let last = 0;

        function split(el) {
          const text = el.textContent;
          el.textContent = "";
          const label = document.createElement("span");
          label.className = "sr-only";
          label.textContent = text;
          el.appendChild(label);
          const holder = document.createElement("span");
          holder.setAttribute("aria-hidden", "true");
          // Letters are inline-block, so group them per word or the browser wraps mid-word.
          for (const word of text.split(" ")) {
            const group = document.createElement("span");
            group.className = "word";
            for (const ch of word) {
              const span = document.createElement("span");
              span.className = "letter";
              span.textContent = ch;
              group.appendChild(span);
              letters.push({ el: span, cx: 0, cy: 0, x: 0, y: 0, vx: 0, vy: 0 });
            }
            holder.appendChild(group);
            holder.appendChild(document.createTextNode(" "));
          }
          el.appendChild(holder);
        }

        function measure() {
          for (const l of letters) l.el.style.transform = "";
          for (const l of letters) {
            const r = l.el.getBoundingClientRect();
            l.cx = r.left + r.width / 2;
            l.cy = r.top + r.height / 2;
          }
        }

        function step(now) {
          const dt = Math.min(1 / 30, (now - last) / 1000) || 1 / 60;
          last = now;
          const k = dt * 60;
          const damping = Math.pow(0.86, k);
          time += dt;
          const radius = Math.min(220, window.innerWidth * 0.22);
          for (let i = 0; i < letters.length; i += 1) {
            const l = letters[i];
            const dx = l.cx + l.x - pointer.x;
            const dy = l.cy + l.y - pointer.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < radius * radius) {
              const d = Math.sqrt(d2) || 1;
              const push = (1 - d / radius) * (pointer.down ? -2.4 : 4);
              l.vx += (dx / d) * push * k;
              l.vy += (dy / d) * push * k;
            }
            const idleY = Math.sin(time * 1.4 + i * 0.25) * 3;
            l.vx -= l.x * 0.06 * k;
            l.vy += (idleY - l.y) * 0.06 * k;
            l.vx *= damping;
            l.vy *= damping;
            l.x += l.vx * k;
            l.y += l.vy * k;
            const rot = l.vx * 1.5;
            l.el.style.transform =
              "translate(" +
              l.x.toFixed(2) +
              "px, " +
              l.y.toFixed(2) +
              "px) rotate(" +
              rot.toFixed(2) +
              "deg)";
          }
          if (pointer.inside) {
            root.style.setProperty("--gx", pointer.x + "px");
            root.style.setProperty("--gy", pointer.y + "px");
          } else {
            root.style.setProperty("--gx", 50 + Math.sin(time * 0.4) * 20 + "%");
            root.style.setProperty("--gy", 50 + Math.cos(time * 0.3) * 15 + "%");
          }
          frame = requestAnimationFrame(step);
        }

        function start() {
          if (frame || reduceMotion) return;
          last = performance.now();
          frame = requestAnimationFrame(step);
        }

        function stop() {
          cancelAnimationFrame(frame);
          frame = 0;
        }

        function track(e) {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.inside = true;
        }

        document.querySelectorAll("[data-split]").forEach(split);
        measure();
        if (document.fonts) document.fonts.ready.then(measure);

        window.addEventListener("pointermove", track);
        window.addEventListener("pointerdown", (e) => {
          pointer.down = true;
          track(e);
        });
        window.addEventListener("pointerup", () => {
          pointer.down = false;
        });
        window.addEventListener("pointercancel", () => {
          pointer.down = false;
        });
        root.addEventListener("pointerleave", () => {
          pointer.x = -9999;
          pointer.y = -9999;
          pointer.down = false;
          pointer.inside = false;
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else start();
        });
        window.addEventListener("resize", measure);

        start();
      })();
    </script>
  </body>
</html>

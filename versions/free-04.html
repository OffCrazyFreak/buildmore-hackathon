<!doctype html>
<!-- Concept: WebGL liquid noise in warm peach that ripples under the pointer -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildMore Hackathon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a0a08;
        --peach: #ffe0c7;
        --coral: #ff7a59;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: radial-gradient(circle at 30% 30%, var(--peach), var(--coral) 70%);
        color: var(--ink);
        font-family: "Bebas Neue", Impact, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #liquid {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .hero {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 6vmin;
        pointer-events: none;
      }

      .hero h1 {
        font-size: clamp(3.4rem, 14vw, 13rem);
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: 0.02em;
      }

      .tagline {
        margin-top: 0.4em;
        font-size: clamp(1.3rem, 4vw, 3.4rem);
        letter-spacing: 0.14em;
      }

      .soon {
        margin-top: 0.6em;
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: clamp(1.4rem, 3.6vw, 3rem);
        letter-spacing: 0.02em;
      }

      :focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="liquid" aria-hidden="true"></canvas>
    <main class="hero">
      <div>
        <h1>BuildMore Hackathon</h1>
        <p class="tagline">Prompt - Review - Ship - Repeat</p>
        <p class="soon">coming soon</p>
      </div>
    </main>
    <script id="frag" type="x-shader/x-fragment">
      precision highp float;
      uniform vec2 u_res;
      uniform float u_time;
      uniform vec2 u_pointer;
      uniform float u_force;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 5; i++) {
          v += a * noise(p);
          p = p * 2.03 + 11.7;
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / u_res;
        float aspect = u_res.x / u_res.y;
        vec2 p = vec2(uv.x * aspect, uv.y);
        vec2 pp = vec2(u_pointer.x * aspect, u_pointer.y);
        float d = distance(p, pp);
        float ripple = sin(d * 28.0 - u_time * 5.0) * u_force * 0.12 / (1.0 + d * 6.0);
        vec2 q = vec2(fbm(p * 1.6 + u_time * 0.08), fbm(p * 1.6 - u_time * 0.06));
        vec2 warp = p + 0.8 * q + ripple + (pp - p) * u_force * 0.3 * exp(-d * 4.0);
        float n = fbm(warp * 1.8);
        vec3 peach = vec3(1.0, 0.878, 0.78);
        vec3 coral = vec3(1.0, 0.478, 0.349);
        vec3 rose = vec3(1.0, 0.7, 0.76);
        vec3 col = mix(coral, peach, smoothstep(0.3, 0.75, n));
        col = mix(col, rose, smoothstep(0.55, 0.9, q.x) * 0.6);
        gl_FragColor = vec4(col, 1.0);
      }
    </script>
    <script>
      (function () {
        const canvas = document.getElementById("liquid");
        const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!gl) {
          // The CSS gradient on body stays visible as the fallback.
          canvas.remove();
          return;
        }
        const vertSrc =
          "attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }";
        const fragSrc = document.getElementById("frag").textContent;
        const target = { x: 0.5, y: 0.5 };
        const smooth = { x: 0.5, y: 0.5 };
        let force = 0;
        let frame = 0;
        const startTime = performance.now();

        function compile(type, src) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, src);
          gl.compileShader(shader);
          return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertSrc));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSrc));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          canvas.remove();
          return;
        }
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, "a_pos");
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(program, "u_res");
        const uTime = gl.getUniformLocation(program, "u_time");
        const uPointer = gl.getUniformLocation(program, "u_pointer");
        const uForce = gl.getUniformLocation(program, "u_force");

        function resize() {
          // Five fbm octaves per pixel: rendering at 1x keeps integrated GPUs at 60 fps.
          const dpr = Math.min(window.devicePixelRatio || 1, 1);
          canvas.width = Math.round(window.innerWidth * dpr);
          canvas.height = Math.round(window.innerHeight * dpr);
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(uRes, canvas.width, canvas.height);
          if (reduceMotion) render(0);
        }

        function render(time) {
          smooth.x += (target.x - smooth.x) * 0.1;
          smooth.y += (target.y - smooth.y) * 0.1;
          force *= 0.96;
          gl.uniform1f(uTime, time);
          gl.uniform2f(uPointer, smooth.x, smooth.y);
          gl.uniform1f(uForce, force);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        function loop(now) {
          render((now - startTime) / 1000);
          frame = requestAnimationFrame(loop);
        }

        function start() {
          if (!frame && !reduceMotion) frame = requestAnimationFrame(loop);
        }

        function stop() {
          cancelAnimationFrame(frame);
          frame = 0;
        }

        function track(e) {
          const nx = e.clientX / window.innerWidth;
          const ny = 1 - e.clientY / window.innerHeight;
          const moved = Math.abs(nx - target.x) + Math.abs(ny - target.y);
          force = Math.min(1, force + moved * 6);
          target.x = nx;
          target.y = ny;
        }

        window.addEventListener("pointermove", track);
        window.addEventListener("pointerdown", (e) => {
          track(e);
          force = 1;
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else start();
        });
        window.addEventListener("resize", resize);

        resize();
        start();
      })();
    </script>
  </body>
</html>

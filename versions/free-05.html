<!doctype html>
<!-- Concept: springy cloth grid with a 3D tilting headline that follows the pointer -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildMore Hackathon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky: #e9f1ff;
        --navy: #0b1b3f;
        --shade: #b7c7ea;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--sky);
        color: var(--navy);
        font-family: "Syne", system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #mesh {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .hero {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 6vmin;
        pointer-events: none;
      }

      #tilt {
        transform-style: preserve-3d;
        will-change: transform;
      }

      .hero h1 {
        font-size: clamp(2.6rem, 9vw, 8.5rem);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.04em;
        text-shadow:
          2px 2px 0 var(--shade),
          4px 4px 0 var(--shade),
          6px 6px 0 var(--shade);
      }

      .tagline {
        margin-top: 1em;
        font-size: clamp(1rem, 2.6vw, 2rem);
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .soon {
        margin-top: 1.1em;
        font-size: clamp(1.1rem, 2.6vw, 2rem);
        font-weight: 400;
        letter-spacing: 0.28em;
      }

      :focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="mesh" aria-hidden="true"></canvas>
    <main class="hero">
      <div id="tilt">
        <h1>BuildMore Hackathon</h1>
        <p class="tagline">Prompt - Review - Ship - Repeat</p>
        <p class="soon">coming soon</p>
      </div>
    </main>
    <script>
      (function () {
        const canvas = document.getElementById("mesh");
        const ctx = canvas.getContext("2d");
        const tiltEl = document.getElementById("tilt");
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const spacing = 44;
        const pointer = { x: -9999, y: -9999, inside: false };
        const tilt = { x: 0, y: 0 };
        let points = [];
        let cols = 0;
        let rows = 0;
        let width = 0;
        let height = 0;
        let time = 0;
        let frame = 0;
        let last = 0;
        let seedTimer = 0;

        function fit() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function seed() {
          cols = Math.min(70, Math.ceil(width / spacing) + 1);
          rows = Math.min(50, Math.ceil(height / spacing) + 1);
          const sx = width / (cols - 1);
          const sy = height / (rows - 1);
          points = [];
          for (let r = 0; r < rows; r += 1) {
            for (let c = 0; c < cols; c += 1) {
              points.push({ rx: c * sx, ry: r * sy, x: 0, y: 0, vx: 0, vy: 0, sx: 0, sy: 0 });
            }
          }
          if (reduceMotion) draw();
        }

        function resize() {
          fit();
          clearTimeout(seedTimer);
          // Rebuilding the grid per resize event stutters, so wait for the drag to settle (except when nothing animates).
          if (reduceMotion) seed();
          else seedTimer = setTimeout(seed, 150);
        }

        function simulate(k) {
          const radius = 170;
          const damping = Math.pow(0.9, k);
          for (let i = 0; i < points.length; i += 1) {
            const p = points[i];
            const dx = p.rx + p.x - pointer.x;
            const dy = p.ry + p.y - pointer.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < radius * radius) {
              const d = Math.sqrt(d2) || 1;
              const f = (1 - d / radius) * 2.4 * k;
              p.vx += (dx / d) * f;
              p.vy += (dy / d) * f;
            }
            const c = i % cols;
            const r = (i - c) / cols;
            let nx = 0;
            let ny = 0;
            let n = 0;
            if (c > 0) {
              nx += points[i - 1].x;
              ny += points[i - 1].y;
              n += 1;
            }
            if (c < cols - 1) {
              nx += points[i + 1].x;
              ny += points[i + 1].y;
              n += 1;
            }
            if (r > 0) {
              nx += points[i - cols].x;
              ny += points[i - cols].y;
              n += 1;
            }
            if (r < rows - 1) {
              nx += points[i + cols].x;
              ny += points[i + cols].y;
              n += 1;
            }
            // Neighbour coupling lets a poke travel outward as a wave instead of a dent.
            p.vx += ((nx / n - p.x) * 0.12 - p.x * 0.03) * k;
            p.vy += ((ny / n - p.y) * 0.12 - p.y * 0.03) * k;
            p.vx *= damping;
            p.vy *= damping;
            p.x += p.vx * k;
            p.y += p.vy * k;
          }
        }

        function draw() {
          ctx.clearRect(0, 0, width, height);
          for (const p of points) {
            p.sx = p.rx + p.x;
            p.sy = p.ry + p.y + Math.sin(p.rx * 0.012 + p.ry * 0.008 + time * 1.2) * 3;
          }
          ctx.strokeStyle = "rgba(43, 74, 138, 0.35)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let i = 0; i < points.length; i += 1) {
            const p = points[i];
            const c = i % cols;
            if (c > 0) {
              ctx.moveTo(points[i - 1].sx, points[i - 1].sy);
              ctx.lineTo(p.sx, p.sy);
            }
            if (i >= cols) {
              ctx.moveTo(points[i - cols].sx, points[i - cols].sy);
              ctx.lineTo(p.sx, p.sy);
            }
          }
          ctx.stroke();
        }

        function updateTilt(k) {
          let tx = Math.sin(time * 0.5) * 3;
          let ty = Math.cos(time * 0.4) * 2;
          if (pointer.inside) {
            tx = (pointer.x / width - 0.5) * 18;
            ty = -(pointer.y / height - 0.5) * 18;
          }
          const follow = 1 - Math.pow(0.92, k);
          tilt.x += (tx - tilt.x) * follow;
          tilt.y += (ty - tilt.y) * follow;
          tiltEl.style.transform =
            "perspective(900px) rotateX(" +
            tilt.y.toFixed(2) +
            "deg) rotateY(" +
            tilt.x.toFixed(2) +
            "deg)";
        }

        function step(now) {
          const dt = Math.min(1 / 30, (now - last) / 1000) || 1 / 60;
          last = now;
          const k = dt * 60;
          time += dt;
          simulate(k);
          draw();
          updateTilt(k);
          frame = requestAnimationFrame(step);
        }

        function start() {
          if (frame || reduceMotion) return;
          last = performance.now();
          frame = requestAnimationFrame(step);
        }

        function stop() {
          cancelAnimationFrame(frame);
          frame = 0;
        }

        function track(e) {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.inside = true;
        }

        function pulse(e) {
          const reach = 240;
          for (const p of points) {
            const dx = p.rx - e.clientX;
            const dy = p.ry - e.clientY;
            const d = Math.sqrt(dx * dx + dy * dy) || 1;
            if (d < reach) {
              const f = (1 - d / reach) * 9;
              p.vx += (dx / d) * f;
              p.vy += (dy / d) * f;
            }
          }
        }

        window.addEventListener("pointermove", track);
        window.addEventListener("pointerdown", (e) => {
          track(e);
          pulse(e);
        });
        document.documentElement.addEventListener("pointerleave", () => {
          pointer.x = -9999;
          pointer.y = -9999;
          pointer.inside = false;
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else start();
        });
        window.addEventListener("resize", resize);

        fit();
        seed();
        start();
      })();
    </script>
  </body>
</html>
